name: diabetes-agent-lab

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-diabetes_agent}
      MYSQL_USER: ${MYSQL_USER:-diabetes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-app-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-diabetes}:${MYSQL_PASSWORD:-change-this-app-password}@mysql:3306/${MYSQL_DATABASE:-diabetes_agent}?charset=utf8mb4
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-this-neo4j-password}
      NEO4J_DATABASE: neo4j
      TRAINING_DATA_SOURCE: database
      HF_HOME: /root/.cache/huggingface
      PYTHONPATH: /app
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
      - huggingface_cache:/root/.cache/huggingface

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  huggingface_cache:
